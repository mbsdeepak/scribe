[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-slm"
version = "0.1.0"
description = "A small language model trained from scratch on TinyStories — GPT-2-compatible so ember can serve it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mbsdeepak" }]
keywords = ["llm", "slm", "gpt", "from-scratch", "tinystories", "language-model"]
dependencies = [
    "torch>=2.6",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["src*"]
